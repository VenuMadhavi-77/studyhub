spring:
  application:
    name: studyhub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE_MB:25}MB
      max-request-size: ${STORAGE_MAX_FILE_SIZE_MB:25}MB
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

studyhub:
  jwt:
    secret: ${JWT_SECRET:dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3JzdHVkeWh1YmFwcGxpY2F0aW9uMjAyNmJ5c3ByaW5nYm9vdDM=}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@studyhub.edu}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:AdminStudyHub#2026}
    bootstrap-name: ${ADMIN_BOOTSTRAP_NAME:System Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://studyhub-frontend-yxlr.onrender.com,https://studyhub-frontend.onrender.com,*}
  storage:
    type: ${STORAGE_TYPE:LOCAL}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
    max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:25}
  ai:
    provider: ${AI_PROVIDER:GEMINI}
    api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:15}
    daily-quota: ${AI_DAILY_QUOTA:100}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
