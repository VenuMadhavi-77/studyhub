spring:
  datasource:
    url: jdbc:h2:file:./data/studyhub;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

studyhub:
  storage:
    type: LOCAL
    local-path: ./uploads

logging:
  level:
    com.studyhub: INFO
