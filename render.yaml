services:
  # =========================================================================
  # 1. Spring Boot 3 Backend Service (Docker container on Render Free Tier)
  # =========================================================================
  - type: web
    name: studyhub-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: STORAGE_LOCAL_PATH
        value: /tmp/uploads
      - key: DB_SSL_MODE
        value: PREFERRED
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 19476
      - key: DB_NAME
        value: defaultdb
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

  # =========================================================================
  # 2. React + Vite Frontend (Static Site on Render Free Tier)
  # =========================================================================
  - type: web
    name: studyhub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
