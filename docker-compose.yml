version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: studyhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-studyhub_db}
      MYSQL_USER: ${DB_USERNAME:-studyhub_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-studyhub_pass_secure}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - studyhub-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyhub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-studyhub_db}
      DB_USERNAME: ${DB_USERNAME:-studyhub_user}
      DB_PASSWORD: ${DB_PASSWORD:-studyhub_pass_secure}
      DB_SSL_MODE: ${DB_SSL_MODE:-DISABLED}
      DB_SSL_PARAMS: ${DB_SSL_PARAMS:-}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/uploads}
      STORAGE_MAX_FILE_SIZE_MB: ${STORAGE_MAX_FILE_SIZE_MB:-25}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@studyhub.edu}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-AdminStudyHub#2026}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-System Administrator}
    ports:
      - "8080:8080"
    volumes:
      - studyhub_uploads:/app/uploads
    networks:
      - studyhub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - studyhub-net

volumes:
  mysql_data:
  studyhub_uploads:

networks:
  studyhub-net:
    driver: bridge
